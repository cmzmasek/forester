# Cross-platform native installers for Archaeopteryx, built with jpackage.
#
# jpackage only produces an installer for the OS+arch it runs on, so this fans out over a
# matrix: macOS arm64 (macos-latest) and Intel x86_64 (macos-13), Windows, and Linux. macOS
# reuses the committed `ant jpackage-dmg` target (icon + version mapping + Info.plist fixup)
# and tags each .dmg with its arch; Windows/Linux invoke jpackage directly here because those
# bundlers have no Ant target yet.
#
# Trigger by pushing a version tag (e.g. 0.9.82) or manually via the Actions tab.
# The .dmg / .msi / .deb are always attached to the run as artifacts; on a version-TAG push the
# 'release' job additionally publishes them to a GitHub Release for that tag (prerelease while on 0.x).
name: installers

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'          # version tags such as 0.9.82

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   kind: mac,   arch: aarch64, label: mac-arm64 }  # Apple Silicon
          - { os: macos-13,       kind: mac,   arch: x86_64,  label: mac-intel }  # Intel
          - { os: windows-latest, kind: win,   label: win }
          - { os: ubuntu-latest,  kind: linux, label: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin — bundles jpackage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Ant + fakeroot (Linux .deb)
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ant fakeroot

      - name: Ensure WiX 3 on PATH (Windows .msi)
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          $candle = Get-ChildItem 'C:\Program Files*\WiX Toolset*' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) {
            choco install wixtoolset --no-progress -y
            $candle = Get-ChildItem 'C:\Program Files*\WiX Toolset*' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $candle) { throw 'WiX 3 (candle.exe) not found — jpackage needs it to build a .msi' }
          Add-Content -Path $env:GITHUB_PATH -Value $candle.DirectoryName

      - name: Build & package
        shell: bash
        working-directory: forester/java
        run: |
          set -euxo pipefail
          if [ "${{ matrix.kind }}" = "mac" ]; then
            # reuse the committed macOS target: fat jar + app-image + icon + Info.plist version fixup + .dmg
            ant jpackage-dmg
            VERSION=$(grep 'VERSION =' src/org/forester/archaeopteryx/AptxConstants.java | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            # tag the dmg with its arch so the Apple-Silicon and Intel builds don't collide as release assets
            mv "dist/Archaeopteryx-$VERSION.dmg" "dist/Archaeopteryx-$VERSION-${{ matrix.arch }}.dmg"
          else
            ant all   # build the self-contained forester.jar
            VERSION=$(grep 'VERSION =' src/org/forester/archaeopteryx/AptxConstants.java | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            mkdir -p dist/input
            cp forester.jar dist/input/
            COMMON=(--name Archaeopteryx
                    --vendor "Christian M. Zmasek"
                    --copyright "Copyright (C) 2026 Christian M. Zmasek"
                    --input dist/input --main-jar forester.jar
                    --main-class org.forester.archaeopteryx.Archaeopteryx
                    --java-options -Xmx2g --dest dist)
            if [ "${{ matrix.kind }}" = "win" ]; then
              # Windows (like macOS) rejects a leading-zero major -> strip it (0.9.82 -> 9.82)
              BUNDLE_VERSION=$(echo "$VERSION" | sed -E 's/^0\.//')
              jpackage --type msi --app-version "$BUNDLE_VERSION" \
                --icon ../../archaeopteryx_icon_assets/archaeopteryx-anime.ico \
                --win-menu --win-shortcut --win-dir-chooser \
                "${COMMON[@]}"
              # jpackage names it Archaeopteryx-<bundle>.msi; use the real version for a clean asset name
              mv dist/*.msi "dist/Archaeopteryx-$VERSION.msi"
            else
              # Linux .deb accepts the real version as-is
              jpackage --type deb --app-version "$VERSION" \
                --icon ../../archaeopteryx_icon_assets/archaeopteryx-badge-512.png \
                --linux-shortcut \
                "${COMMON[@]}"
            fi
          fi
          ls -la dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Archaeopteryx-${{ matrix.label }}
          path: |
            forester/java/dist/*.dmg
            forester/java/dist/*.msi
            forester/java/dist/*.deb
          if-no-files-found: error

  # On a version-tag push only, gather the three installers and publish them to a GitHub Release.
  # Manual (workflow_dispatch) runs skip this and just leave the run artifacts.
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # create the release + upload assets (the build jobs stay read-only)
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts         # each artifact lands under artifacts/<name>/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="$GITHUB_REF_NAME"
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \) -exec cp {} release/ \;
          ls -la release
          # prerelease while the project is on 0.x
          PRE=""
          case "$TAG" in 0.*) PRE="--prerelease" ;; esac
          {
            echo "Native installers for Archaeopteryx $TAG, built by CI from the tagged source."
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS (Apple Silicon) | Archaeopteryx-$TAG-aarch64.dmg |"
            echo "| macOS (Intel) | Archaeopteryx-$TAG-x86_64.dmg |"
            echo "| Windows | Archaeopteryx-$TAG.msi |"
            echo "| Linux (Debian/Ubuntu) | archaeopteryx_${TAG}_amd64.deb |"
            echo
            echo "**Not code-signed or notarized yet:** on macOS you may see \"unidentified developer\" (right-click the app and choose Open the first time); on Windows, SmartScreen may prompt (More info -> Run anyway)."
          } > notes.md
          # idempotent: create the release if missing, else refresh its notes; then (re)upload the assets
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md $PRE
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Archaeopteryx $TAG" --notes-file notes.md $PRE
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" release/* --clobber
